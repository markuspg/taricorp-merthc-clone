[package]
name = "merthc"
version = "0.2.0"
authors = ["Peter Marheine <peter@taricorp.net>"]
rust-version = "1.85"
build = "build.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11"
llvm-sys = "140"
libc = "0.2"
log = "0.4"
phf = "0.14"
tempfile = "3"

[build-dependencies]
cc = "1.11.1"
phf_codegen = "0.14"
